<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제주 지역 맞춤형 AI 모기 활동 예측 서비스</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    body { margin: 0; background: #f3f6fa; color: #1f2937; padding: 24px 16px; }
    .container { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    header { border-bottom: 2px solid #e5e7eb; padding-bottom: 16px; margin-bottom: 22px; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 22px; color: #0f172a; }
    p.sub { margin: 6px 0 0; font-size: 14px; color: #4b5563; }
    .preset-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .preset-btn { background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .preset-btn:hover { background: #e2e8f0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #374151; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    .field input:focus, .field select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary { flex: 1; background: #1e3a8a; color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-reset { background: #e5e7eb; color: #374151; border: none; padding: 13px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .error-box { display: none; margin-top: 16px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .result-box { display: none; margin-top: 22px; border-radius: 12px; padding: 20px; border: 1px solid #dbeafe; background: #f8fafc; }
    .result-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .score { font-size: 32px; font-weight: 800; color: #0f172a; }
    .stage-pill { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 800; }
    .stage-low { background: #e5e7eb; color: #374151; }
    .stage-mid { background: #fef3c7; color: #b45309; }
    .stage-high { background: #fee2e2; color: #b91c1c; }
    .meta { font-size: 13px; color: #475569; margin-bottom: 12px; background: #fff; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .guide-title { font-size: 14px; font-weight: 700; color: #1e3a8a; margin-bottom: 6px; }
    ul.guide-list { margin: 0; padding-left: 18px; font-size: 14px; color: #334155; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">딥러닝(MLP) 기반 예측 시스템</span>
      <h1>제주 지역 맞춤형 AI 모기 활동 예측 서비스</h1>
      <p class="sub">기온·강수량·전일 모기지수를 바탕으로 당일 모기지수와 방역 활동 단계를 예측합니다.</p>
    </header>

    <div class="preset-bar">
      <button type="button" class="preset-btn" onclick="applyPreset('제주시', 25.0, 18.0, 3.0, 28.5)">예시 1: 제주시 초가을(높음)</button>
      <button type="button" class="preset-btn" onclick="applyPreset('서귀포시', 21.1, 13.6, 0.5, 18.5)">예시 2: 검증 데이터 10/26(보통)</button>
      <button type="button" class="preset-btn" onclick="applyPreset('제주시', 14.4, 4.0, 0.0, 24.5)">예시 3: 검증 데이터 10/28(낮음)</button>
    </div>

    <div class="grid">
      <div class="field">
        <label for="region">관측 대상 지역</label>
        <select id="region">
          <option value="제주시">제주시 (북부 해안·도심권)</option>
          <option value="서귀포시">서귀포시 (남부 온난·습윤권)</option>
          <option value="제주 중산간">제주 중산간 지역</option>
        </select>
      </div>
      <div class="field">
        <label for="prevIndex">전일 모기지수 (0 이상)</label>
        <input type="number" id="prevIndex" step="0.1" min="0" placeholder="예: 21.7" />
      </div>
      <div class="field">
        <label for="maxTemp">일최고기온 (℃)</label>
        <input type="number" id="maxTemp" step="0.1" placeholder="예: 21.1" />
      </div>
      <div class="field">
        <label for="minTemp">일최저기온 (℃)</label>
        <input type="number" id="minTemp" step="0.1" placeholder="예: 13.6" />
      </div>
      <div class="field">
        <label for="rain">일강수량 (mm, 0 이상)</label>
        <input type="number" id="rain" step="0.1" min="0" placeholder="예: 0.5" />
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-primary" onclick="predictMosquito()">AI 모기 활동 예측 실행</button>
      <button type="button" class="btn-reset" onclick="resetForm()">초기화</button>
    </div>

    <div id="errorBox" class="error-box"></div>

    <div id="resultBox" class="result-box">
      <div class="result-header">
        <div>
          <div style="font-size:13px; color:#64748b; font-weight:600;" id="resultRegionLabel">예측 결과</div>
          <div class="score"><span id="predScore">0.0</span> <span style="font-size:15px; font-weight:600; color:#475569;">(예측 모기지수)</span></div>
        </div>
        <span id="stageBadge" class="stage-pill stage-low">낮음</span>
      </div>
      <div class="meta" id="calcMeta"></div>
      <div class="guide-title">제주 지역 맞춤형 방역 및 생활 대응 수칙</div>
      <ul class="guide-list" id="guideList"></ul>
    </div>
  </div>

  <script>
    // 학습 완료된 딥러닝(MLP) 표준화 파라미터 및 가중치
    const SCALER_MEAN = [17.7417, 4.2917, 24.675];
    const SCALER_SCALE = [3.4132, 12.9075, 8.15];
    const W0 = [
      [-0.0001, 1.7927, -0.0001, 0.0, 0.0, 0.4416],
      [0.0, 0.3775, 0.0004, 0.0, 0.0, 0.0932],
      [0.0, 1.2258, 0.0002, 0.0, 0.0, 0.3019]
    ];
    const B0 = [-1.3726, 7.6124, -1.0515, -0.8415, -1.1814, 2.1138];
    const W1 = [0.0001, 2.2049, 0.0002, 0.0, 0.0, 0.5434];
    const B1 = 6.5585;

    function applyPreset(region, maxT, minT, rain, prev) {
      document.getElementById("region").value = region;
      document.getElementById("maxTemp").value = maxT;
      document.getElementById("minTemp").value = minT;
      document.getElementById("rain").value = rain;
      document.getElementById("prevIndex").value = prev;
      predictMosquito();
    }

    function resetForm() {
      ["prevIndex", "maxTemp", "minTemp", "rain"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("resultBox").style.display = "none";
    }

    function predictMosquito() {
      const errorBox = document.getElementById("errorBox");
      const resultBox = document.getElementById("resultBox");
      errorBox.style.display = "none";

      const region = document.getElementById("region").value;
      const maxT = parseFloat(document.getElementById("maxTemp").value);
      const minT = parseFloat(document.getElementById("minTemp").value);
      const rain = parseFloat(document.getElementById("rain").value);
      const prev = parseFloat(document.getElementById("prevIndex").value);

      if ([maxT, minT, rain, prev].some(v => Number.isNaN(v))) {
        errorBox.textContent = "입력 오류: 모든 기상 및 전일 모기지수 항목을 숫자로 입력해 주세요.";
        errorBox.style.display = "block";
        resultBox.style.display = "none";
        return;
      }
      if (minT > maxT) {
        errorBox.textContent = "입력 오류: 일최저기온은 일최고기온보다 높을 수 없습니다.";
        errorBox.style.display = "block";
        resultBox.style.display = "none";
        return;
      }
      if (rain < 0 || prev < 0) {
        errorBox.textContent = "입력 오류: 일강수량과 전일 모기지수는 0 이상의 값이어야 합니다.";
        errorBox.style.display = "block";
        resultBox.style.display = "none";
        return;
      }

      const avgTemp = (maxT + minT) / 2;
      const inputs = [avgTemp, rain, prev];
      const scaled = inputs.map((val, i) => (val - SCALER_MEAN[i]) / SCALER_SCALE[i]);

      let out = B1;
      for (let j = 0; j < 6; j++) {
        let sum = B0[j];
        for (let i = 0; i < 3; i++) sum += scaled[i] * W0[i][j];
        const relu = Math.max(0, sum);
        out += relu * W1[j];
      }
      const pred = Math.max(0, Math.round(out * 10) / 10);

      let stage = "낮음";
      let badgeClass = "stage-low";
      let guides = [
        "모기 활동이 적은 단계입니다. 일반 위생 관리 및 배수구 점검을 유지하세요.",
        "강수 예보가 있을 경우 화분 받침과 폐타이어 등 고인 물이 생기지 않도록 미리 정비하세요."
      ];

      if (pred >= 29.4) {
        stage = "높음";
        badgeClass = "stage-high";
        guides = [
          "모기 활동이 매우 활발한 단계입니다. 야간 야외 활동 시 기피제를 반드시 사용하세요.",
          "방역 당국 및 시설 관리자는 주거지 주변 하수구·물웅덩이 유충 구제와 집중 연무 방역을 즉시 시행하세요.",
          "가정에서는 방충망 틈새를 점검하고 취침 전 실내 모기 유입 여부를 확인하세요."
        ];
      } else if (pred >= 19.0) {
        stage = "보통";
        badgeClass = "stage-mid";
        guides = [
          "모기 활동이 증가하는 단계입니다. 해 질 녘 야외 활동 시 긴 소매 착용을 권장합니다.",
          "비 온 뒤 습도가 높아지면 개체수가 급증할 수 있으므로 주거지 인근 고인 물을 제거하세요."
        ];
      }

      document.getElementById("resultRegionLabel").textContent = `${region} · 딥러닝(MLP) 예측 결과`;
      document.getElementById("predScore").textContent = pred.toFixed(1);
      const badge = document.getElementById("stageBadge");
      badge.textContent = `활동 단계: ${stage}`;
      badge.className = `stage-pill ${badgeClass}`;

      document.getElementById("calcMeta").textContent =
        `자동 가공된 입력 속성 → 일평균기온: ${avgTemp.toFixed(2)}℃ | 일강수량: ${rain.toFixed(1)}mm | 전일 모기지수: ${prev.toFixed(1)}`;

      const guideList = document.getElementById("guideList");
      guideList.innerHTML = guides.map(g => `<li>${g}</li>`).join("");
      resultBox.style.display = "block";
    }
  </script>
</body>
</html>
